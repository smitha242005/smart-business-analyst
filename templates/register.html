<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Business Analyst</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card p-5">

        <!-- Logo -->
        <div class="text-center mb-4">
            <div class="auth-logo mb-3">
                <i class="fas fa-chart-line fa-3x"></i>
            </div>
            <h3 class="fw-bold">Smart Business Analyst</h3>
            <p class="text-muted">Create your account</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Register Form -->
        <form method="POST" action="/register">
            <div class="mb-3">
                <label class="form-label fw-semibold">
                    <i class="fas fa-user me-1"></i>Username
                </label>
                <input type="text" name="username" class="form-control auth-input"
                    placeholder="Enter your username" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    <i class="fas fa-envelope me-1"></i>Email Address
                </label>
                <input type="email" name="email" class="form-control auth-input"
                    placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    <i class="fas fa-lock me-1"></i>Password
                </label>
                <div class="input-group">
                    <input type="password" name="password" id="passwordInput"
                        class="form-control auth-input"
                        placeholder="Minimum 6 characters" required>
                    <button class="btn btn-outline-secondary" type="button"
                        onclick="togglePassword('passwordInput', 'eyeIcon1')">
                        <i class="fas fa-eye" id="eyeIcon1"></i>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">
                    <i class="fas fa-lock me-1"></i>Confirm Password
                </label>
                <div class="input-group">
                    <input type="password" name="confirm_password" id="confirmInput"
                        class="form-control auth-input"
                        placeholder="Re-enter your password" required>
                    <button class="btn btn-outline-secondary" type="button"
                        onclick="togglePassword('confirmInput', 'eyeIcon2')">
                        <i class="fas fa-eye" id="eyeIcon2"></i>
                    </button>
                </div>
            </div>

            <!-- Password Match Indicator -->
            <div id="matchMsg" class="small mb-3 d-none"></div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg auth-btn" id="registerBtn">
                    <i class="fas fa-user-plus me-2"></i>Create Account
                </button>
            </div>
        </form>

        <!-- Login Link -->
        <div class="text-center mt-4">
            <p class="text-muted">Already have an account?
                <a href="/login" class="auth-link fw-bold">Login here</a>
            </p>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // Password match checker
    document.getElementById('confirmInput').addEventListener('input', function() {
        const password = document.getElementById('passwordInput').value;
        const confirm = this.value;
        const matchMsg = document.getElementById('matchMsg');
        const registerBtn = document.getElementById('registerBtn');

        matchMsg.classList.remove('d-none');
        if (password === confirm) {
            matchMsg.innerHTML = '<span class="text-success"><i class="fas fa-check-circle me-1"></i>Passwords match!</span>';
            registerBtn.disabled = false;
        } else {
            matchMsg.innerHTML = '<span class="text-danger"><i class="fas fa-times-circle me-1"></i>Passwords do not match!</span>';
            registerBtn.disabled = true;
        }
    });
</script>
</body>
</html>
